[package]
name = "tinyinference"
version = "0.2.0"
edition = "2024"
description = "A minimal web control plane for memory-conscious llama.cpp inference"
license = "MIT"

[dependencies]
anyhow = "1.0"
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.38"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
toml = "0.9"
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3.23"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
