[package]
name = "tinyinference"
version = "0.4.0-beta"
edition = "2024"
description = "A minimal web control plane for memory-conscious llama.cpp inference"
license = "MIT"

[dependencies]
anyhow = "1.0"
axum = "0.8"
axum-server = { version = "0.7", features = ["tls-rustls"] }
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.38"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "0.9"
ureq = { version = "3.3.0", default-features = false, features = ["rustls", "json"] }
mdns-sd = "0.20.3"
local-ip-address = "0.6.13"
getrandom = "0.4.3"
rcgen = "0.14"

[dev-dependencies]
tempfile = "3.23"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
