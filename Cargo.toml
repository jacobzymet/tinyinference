[package]
name = "tinyinference"
version = "0.3.0"
edition = "2024"
description = "A minimal web control plane for memory-conscious llama.cpp inference"
license = "MIT"

[dependencies]
anyhow = "1.0"
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.38"
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
tao = { version = "0.35", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "0.9"
ureq = { version = "3.3.0", default-features = false, features = ["rustls", "json"] }
wry = { version = "0.55", optional = true }

[dev-dependencies]
tempfile = "3.23"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[features]
default = ["desktop"]
# Runs the control panel in a native window (WebView2 / WKWebView / WebKitGTK)
# instead of requiring a browser. Build with --no-default-features for a
# headless, browser-only binary — useful on servers, or on Linux boxes without
# the webkit2gtk development packages.
desktop = ["dep:wry", "dep:tao", "dep:image"]
